<div class="product-create-form">
    
    <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput #txtName>
    </mat-form-field>
    <mat-form-field>
        <mat-label>Stock</mat-label>
        <input matInput type="number" min="0" #txtStock value="0">
    </mat-form-field>
    <mat-form-field>
        <mat-label>Stock</mat-label>
        <input matInput type="number" min="0" value="0" #txtPrice>
    </mat-form-field>
    <button mat-raised-button (click)="create(txtName, txtStock, txtPrice)">Basic</button>
</div>
